<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — CA Odonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --gold-1:#E3C589;
    --gold-2:#9C7A2E;
    --gold-gradient:linear-gradient(135deg,var(--gold-1),var(--gold-2));
    --text:#2E2C29;
    --text-soft:#6B6660;
    --bg:#FFFFFF;
    --bg-soft:#FBF8F2;
    --border:#EBE3D2;
    --danger:#C1503F;
    --danger-bg:#FBEBE8;
    --ok:#3F9463;
    --ok-bg:#EAF6EF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--bg-soft);
    color:var(--text);
    min-height:100vh;
  }

  /* ---------- Login screen ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:#fff;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(120,95,30,0.12);
    padding:40px 32px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .login-logo{width:100%;max-width:190px;height:auto;margin:0 auto 8px;display:block;}
  .login-sub{font-size:13px;color:var(--text-soft);margin:0 0 28px;}
  .form-group{text-align:left;margin-bottom:16px;}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
  .form-group input{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    outline:none;
  }
  .form-group input:focus{border-color:var(--gold-2);}
  .btn-primary{
    width:100%;
    background:var(--gold-gradient);
    border:none;
    color:#fff;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    padding:13px 20px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(156,122,46,0.28);
    margin-top:8px;
  }
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .login-error{
    color:var(--danger);
    font-size:12.5px;
    margin-top:14px;
    min-height:16px;
  }

  /* ---------- App screen ---------- */
  #appScreen{display:none;flex-direction:column;min-height:100vh;}
  .topbar{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .topbar-logo{height:28px;width:auto;}
  .topbar-name{font-size:13px;font-weight:600;color:var(--text);}
  .topbar-name span{display:block;font-size:11px;font-weight:400;color:var(--text-soft);}
  .logout-btn{
    background:var(--bg-soft);
    border:1px solid var(--border);
    color:var(--text-soft);
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .logout-btn:hover{color:var(--text);border-color:var(--gold-2);}

  .day-nav{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .day-nav-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .day-nav-btn:hover{border-color:var(--gold-2);}
  .day-label-wrap{flex:1;text-align:center;}
  .day-label{font-size:14px;font-weight:600;text-transform:capitalize;}
  .day-sub{font-size:11px;color:var(--text-soft);margin-top:1px;}
  .today-btn{
    border:1px solid var(--gold-2);
    background:#fff;
    color:var(--gold-2);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .today-btn:hover{background:var(--bg-soft);}
  .date-jump-btn{
    position:relative;
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .date-jump-btn:hover{border-color:var(--gold-2);}
  .date-jump-btn input[type="date"]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    border:none;
  }

  .content{
    flex:1;
    padding:18px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .empty-day{
    text-align:center;
    color:var(--text-soft);
    font-size:13.5px;
    padding:60px 20px;
  }
  .apt-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .apt-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }
  .apt-time{
    font-size:16px;
    font-weight:700;
    color:var(--gold-2);
  }
  .apt-time span{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--text-soft);
  }
  .badge{
    font-size:11px;
    font-weight:600;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.agendado{background:#FCEBD5;color:#B5651D;}
  .badge.confirmado{background:#FBF3E3;color:var(--gold-2);}
  .badge.concluido{background:var(--ok-bg);color:var(--ok);}
  .badge.cancelado{background:var(--danger-bg);color:var(--danger);}
  .apt-patient{font-size:14.5px;font-weight:600;margin-bottom:2px;}
  .apt-service{font-size:13px;color:var(--text-soft);margin-bottom:6px;}
  .apt-room{font-size:12px;color:var(--gold-2);font-weight:600;margin-bottom:6px;}
  .apt-phone{
    font-size:13px;
    color:var(--text);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .notes-label{
    font-size:11px;
    font-weight:600;
    color:var(--text-soft);
    margin-top:12px;
    margin-bottom:6px;
  }
  .notes-field{
    width:100%;
    height:56px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    font-family:inherit;
    font-size:12px;
    color:var(--text);
    resize:vertical;
    outline:none;
  }
  .notes-field:focus{border-color:var(--gold-2);}
  .apt-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .apt-actions button{
    flex:1;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:10px 8px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid var(--border);
    background:#fff;
  }
  .apt-actions .btn-reagendar{color:#4A6A8E;border-color:#4A6A8E;}
  .apt-actions .btn-reagendar:hover{background:#EAF0F6;}
  .apt-actions .btn-confirmar{color:var(--ok);border-color:var(--ok);}
  .apt-actions .btn-confirmar:hover{background:var(--ok-bg);}
  .apt-actions .btn-done{color:var(--ok);border-color:var(--ok);}
  .apt-actions .btn-done:hover{background:var(--ok-bg);}
  .apt-actions .btn-cancel{color:var(--danger);border-color:var(--danger);}
  .apt-actions .btn-cancel:hover{background:var(--danger-bg);}
  .apt-actions .btn-excluir{color:var(--danger);border-color:var(--danger);transition:background .15s, color .15s;}
  .apt-actions .btn-excluir:hover{background:var(--danger);color:#fff;}

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--text);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:50;
    display:none;
    max-width:90vw;
    text-align:center;
  }

  @media (min-width:640px){
    .content{padding:24px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" alt="CA Odonto">
    <p class="login-sub">Acesso restrito às dentistas da clínica</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="topbar">
    <div class="topbar-brand">
      <img class="topbar-logo" id="topbarLogo" alt="CA Odonto">
      <div class="topbar-name" id="dentistName">—<span>CA Odonto</span></div>
    </div>
    <button class="logout-btn" id="logoutBtn" type="button">Sair</button>
  </div>

  <div class="day-nav">
    <button class="day-nav-btn" id="dayPrev" type="button">‹</button>
    <div class="day-label-wrap">
      <div class="day-label" id="dayLabel">—</div>
      <div class="day-sub" id="daySub">—</div>
    </div>
    <button class="day-nav-btn" id="dayNext" type="button">›</button>
    <button class="today-btn" id="todayBtn" type="button">Hoje</button>
    <div class="date-jump-btn" title="Escolher data">
      📅
      <input type="date" id="dateJump" aria-label="Escolher data">
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty-day">Carregando agenda...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

};

document.getElementById('loginLogo').src = `data:image/webp;base64,${CONFIG.logoBase64}`;
document.getElementById('topbarLogo').src = `data:image/webp;base64,${CONFIG.logoBase64}`;

const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

const WEEKDAY_LABELS_LONG = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MONTH_LABELS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let currentDentist = null;
let currentDate = new Date();

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isSameDay(a,b){ return toISO(a) === toISO(b); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.style.display = 'none'; }, 3500);
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    await loadDentistProfile();
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Entrar';

  if (error){
    errorEl.textContent = 'E-mail ou senha inválidos.';
    return;
  }

  await loadDentistProfile();
});

async function loadDentistProfile(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user){
    document.getElementById('loginError').textContent = 'Sessão inválida. Faça login novamente.';
    return;
  }

  const { data, error } = await sb.from('dentists').select('*').eq('auth_user_id', user.id).maybeSingle();

  if (error || !data){
    document.getElementById('loginError').textContent = 'Seu usuário não está vinculado a nenhuma dentista. Contate o administrador.';
    await sb.auth.signOut();
    return;
  }

  currentDentist = data;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('dentistName').innerHTML = `${currentDentist.name}<span>${currentDentist.specialty || 'CA Odonto'}</span>`;

  currentDate = new Date();
  renderDayNav();
  await loadAppointments();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  currentDentist = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
});

document.getElementById('dayPrev').addEventListener('click', () => changeDay(-1));
document.getElementById('dayNext').addEventListener('click', () => changeDay(1));
document.getElementById('todayBtn').addEventListener('click', () => {
  currentDate = new Date();
  renderDayNav();
  loadAppointments();
});

document.getElementById('dateJump').addEventListener('change', (e) => {
  if (!e.target.value) return;
  const [y, m, d] = e.target.value.split('-').map(Number);
  currentDate = new Date(y, m - 1, d);
  renderDayNav();
  loadAppointments();
});

function changeDay(delta){
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + delta);
  renderDayNav();
  loadAppointments();
}

function renderDayNav(){
  const today = new Date();
  const weekday = WEEKDAY_LABELS_LONG[currentDate.getDay()];
  const label = isSameDay(currentDate, today)
    ? `Hoje, ${weekday}`
    : weekday;
  document.getElementById('dayLabel').textContent = label;
  document.getElementById('daySub').textContent =
    `${pad(currentDate.getDate())} de ${MONTH_LABELS[currentDate.getMonth()]} de ${currentDate.getFullYear()}`;
  document.getElementById('dateJump').value = toISO(currentDate);
}

async function loadAppointments(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty-day">Carregando agenda...</div>';

  const iso = toISO(currentDate);
  const { data, error } = await sb
    .from('appointments')
    .select('*, services(name, category)')
    .eq('dentist_id', currentDentist.id)
    .eq('date', iso)
    .neq('status', 'cancelado')
    .order('start_time', { ascending: true });

  if (error){
    console.error(error);
    content.innerHTML = '<div class="empty-day">Não foi possível carregar a agenda.</div>';
    return;
  }

  if (!data || !data.length){
    content.innerHTML = '<div class="empty-day">Nenhuma consulta marcada para este dia.</div>';
    return;
  }

  content.innerHTML = '';
  for (const apt of data){
    content.appendChild(renderAptCard(apt));
  }
}

function renderAptCard(apt){
  const card = document.createElement('div');
  card.className = 'apt-card';

  const statusLabels = { agendado: 'Agendado', confirmado: 'Confirmada', concluido: 'Concluída', cancelado: 'Cancelada' };
  const serviceName = apt.services ? apt.services.name : 'Procedimento';
  const phoneDigits = (apt.patient_phone || '').replace(/\D/g, '');

  card.innerHTML = `
    <div class="apt-top">
      <div class="apt-time">${apt.start_time.slice(0,5)}<span>até ${apt.end_time.slice(0,5)}</span></div>
      <div class="badge ${apt.status}">${statusLabels[apt.status] || apt.status}</div>
    </div>
    <div class="apt-patient">${apt.patient_name}</div>
    <div class="apt-service">${serviceName}</div>
    <div class="apt-room">🏥 ${apt.room || 'Sala 1'}</div>
    <a class="apt-phone" href="tel:${phoneDigits}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9C7A2E" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      ${apt.patient_phone}
    </a>
    <div class="notes-label">Observações</div>
    <textarea class="notes-field" placeholder="Adicionar observações desta consulta...">${apt.notes || ''}</textarea>
  `;

  const notesField = card.querySelector('.notes-field');
  notesField.addEventListener('blur', () => saveNotes(apt.id, notesField.value));

  if (apt.status === 'agendado'){
    const actions = document.createElement('div');
    actions.className = 'apt-actions';
    actions.innerHTML = `
      <button type="button" class="btn-confirmar">Confirmar</button>
      <button type="button" class="btn-reagendar">Reagendar</button>
      <button type="button" class="btn-cancel">Cancelar</button>
    `;
    actions.querySelector('.btn-confirmar').addEventListener('click', () => updateStatus(apt.id, 'confirmado'));
    actions.querySelector('.btn-reagendar').addEventListener('click', () => {
      window.open('/index.html', '_blank');
    });
    actions.querySelector('.btn-cancel').addEventListener('click', () => {
      if (confirm(`Cancelar a consulta de ${apt.patient_name} às ${apt.start_time.slice(0,5)}?`)){
        updateStatus(apt.id, 'cancelado');
      }
    });
    card.appendChild(actions);
  }

  if (apt.status === 'confirmado'){
    const actions = document.createElement('div');
    actions.className = 'apt-actions';
    actions.innerHTML = `
      <button type="button" class="btn-reagendar">Reagendar</button>
      <button type="button" class="btn-done">Concluir</button>
      <button type="button" class="btn-cancel">Cancelar</button>
    `;
    actions.querySelector('.btn-reagendar').addEventListener('click', () => {
      window.open('/index.html', '_blank');
    });
    actions.querySelector('.btn-done').addEventListener('click', () => updateStatus(apt.id, 'concluido'));
    actions.querySelector('.btn-cancel').addEventListener('click', () => {
      if (confirm(`Cancelar a consulta de ${apt.patient_name} às ${apt.start_time.slice(0,5)}?`)){
        updateStatus(apt.id, 'cancelado');
      }
    });
    card.appendChild(actions);
  }

  if (apt.status === 'concluido'){
    const actions = document.createElement('div');
    actions.className = 'apt-actions';
    actions.innerHTML = `<button type="button" class="btn-excluir">Excluir</button>`;
    actions.querySelector('.btn-excluir').addEventListener('click', () => {
      if (confirm(`Excluir permanentemente a consulta de ${apt.patient_name} às ${apt.start_time.slice(0,5)}? Esta ação não pode ser desfeita.`)){
        deleteAppointment(apt.id);
      }
    });
    card.appendChild(actions);
  }

  return card;
}

async function deleteAppointment(id){
  const { data, error } = await sb.from('appointments').delete().eq('id', id).select('id');
  if (error || !data || !data.length){
    console.error(error);
    showToast('Não foi possível excluir a consulta.');
    return;
  }
  showToast('Consulta excluída.');
  await loadAppointments();
}

async function saveNotes(id, notes){
  const { error } = await sb.from('appointments').update({ notes }).eq('id', id);
  if (error){
    console.error(error);
    showToast('Não foi possível salvar as observações.');
  }
}

async function updateStatus(id, status){
  const { error } = await sb.from('appointments').update({ status }).eq('id', id);
  if (error){
    console.error(error);
    showToast('Não foi possível atualizar o status.');
    return;
  }
  await loadAppointments();
}

boot();
</script>
</body>
